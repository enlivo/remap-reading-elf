<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Box QR Card</title>
<style>
@font-face {
  font-family: "Kind Bond";
  src: url("../assets/fonts/kind-bond.otf") format("opentype");
  font-display: block;
}
@font-face {
  font-family: "Nunito";
  src: url("../assets/fonts/nunito-variable.ttf") format("truetype");
  font-weight: 200 1000;
  font-display: block;
}

@page {
  size: A4 portrait;
  margin: 0;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #ECC067;
}

body {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  font-family: "Nunito", Arial, sans-serif;
  color: #1f1a17;
}

.page {
  width: 210mm;
  height: 297mm;
  background: #ECC067;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card {
  width: 178mm;
  padding: 16mm 14mm 15mm;
  background: #F6CFB7;
  border-radius: 9mm;
  text-align: center;
}

h1 {
  margin: 0;
  font-family: "Kind Bond", Georgia, serif;
  font-weight: 400;
  font-size: 40pt;
  line-height: 1.1;
  color: #B94E38;
}

.subline {
  margin: 6mm auto 0;
  max-width: 140mm;
  font-size: 16pt;
  font-weight: 700;
  line-height: 1.4;
  color: #7a4a33;
}

.qr-frame {
  display: inline-block;
  margin: 9mm 0 0;
  padding: 7mm;
  background: #ffffff;
  border-radius: 4mm;
  line-height: 0;
}

.qr {
  display: block;
  width: 85mm;
  height: 85mm;
}

.url {
  margin: 8mm 0 0;
  font-family: "Kind Bond", Georgia, serif;
  font-size: 22pt;
  color: #B94E38;
}

@media print {
  .page { height: 297mm; }
}
</style>
</head>
